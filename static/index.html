<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Promised Land - 应许之地</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="fog_effect.css">
</head>
<body>
    <!-- 左侧玩家列表 -->
    <div id="player-list-container">
        <h3>在线玩家</h3>
        <ul id="player-list">
            <!-- 玩家列表将动态添加 -->
        </ul>
    </div>
    
    <!-- 主游戏区域 -->
    <div id="main-container">
        <!-- 房间信息 -->
        <div id="room-info">
            <h2>冒险房间</h2>
            <p id="room-id">房间ID: 加载中...</p>
            <p id="player-count">在线玩家: 0</p>
        </div>
        
        <!-- 游戏内容区域 -->
        <div id="game-content">
            <!-- 个人剧情区域 -->
            <div id="personal-story-container">
                <h3>你的冒险</h3>
                <div id="personal-story" class="story-content"></div>
                <div id="input-container">
                    <input id="input" type="text" placeholder="描述你的行动...">
                </div>
                
                <!-- 玩家状态区域 -->
                <div id="player-status-container">
                    <h3>角色状态</h3>
                    <div id="player-status">
                        <!-- 玩家状态将动态添加 -->
                    </div>
                </div>
            </div>
            
            <!-- 右侧区域 -->
            <div id="world-info-container">
                <h3>世界信息</h3>
                <div id="world-info" class="story-content"></div>
                
                <!-- 游戏地图区域 -->
                <h3>冒险地图</h3>
                <div id="game-map-container">
                    <!-- ASCII地图将动态添加 -->
                    <div id="game-map"></div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 先加载迷雾效果模块，再加载主游戏脚本 -->
    <script src="fog_effect.js"></script>
    <script src="game.js"></script>
</body>
</html>
